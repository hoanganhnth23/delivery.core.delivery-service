spring.application.name=delivery-service
spring.config.import=${CONFIG_SERVER_IMPORT:optional:configserver:http://config-server:8888},optional:configtree:/run/secrets/
spring.cloud.config.fail-fast=${CONFIG_SERVER_FAIL_FAST:false}
spring.cloud.config.retry.initial-interval=1000
spring.cloud.config.retry.max-interval=5000
spring.cloud.config.retry.max-attempts=12
eureka.client.enabled=${SERVICE_DISCOVERY_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://discovery-server:8761/eureka/}
eureka.client.healthcheck.enabled=true
eureka.instance.instance-id=${spring.application.name}:${HOSTNAME:${random.value}}
eureka.instance.prefer-ip-address=false
eureka.instance.metadata-map.management.port=${management.server.port}
eureka.instance.metadata-map.readiness-path=/actuator/health/readiness
management.tracing.sampling.probability=${TRACING_SAMPLE_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true
management.server.port=${MANAGEMENT_SERVER_PORT:9090}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.readiness.include=*
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.prometheus.metrics.export.enabled=${METRICS_PROMETHEUS_ENABLED:true}
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.percentiles-histogram.http.server.requests=true
app.internal.secret=${internal-secret:${INTERNAL_SECRET:}}
server.port=8085

# Database configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/delivery_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=${DELIVERY_DB_CONNECTION_TIMEOUT_MS:3000}
spring.datasource.hikari.validation-timeout=${DELIVERY_DB_VALIDATION_TIMEOUT_MS:1000}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
app.outbox.relay-enabled=${DELIVERY_OUTBOX_RELAY_ENABLED:true}
app.outbox.poll-delay-ms=${DELIVERY_OUTBOX_POLL_DELAY_MS:1000}
app.outbox.batch-size=${DELIVERY_OUTBOX_BATCH_SIZE:50}
app.outbox.send-timeout-seconds=${DELIVERY_OUTBOX_SEND_TIMEOUT_SECONDS:10}
app.outbox.max-attempts=${DELIVERY_OUTBOX_MAX_ATTEMPTS:10}
app.outbox.lease-seconds=${DELIVERY_OUTBOX_LEASE_SECONDS:30}
spring.task.scheduling.pool.size=${DELIVERY_SCHEDULER_POOL_SIZE:3}
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=10s
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Security logging (for debugging)
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

# Hide Kafka connection spam when Kafka is not running
logging.level.org.apache.kafka=ERROR

# ✅ Kafka Configuration - Independent microservice approach
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.properties.max.block.ms=${DELIVERY_KAFKA_MAX_BLOCK_MS:5000}
spring.kafka.producer.properties.request.timeout.ms=${DELIVERY_KAFKA_REQUEST_TIMEOUT_MS:5000}
spring.kafka.producer.properties.delivery.timeout.ms=${DELIVERY_KAFKA_DELIVERY_TIMEOUT_MS:10000}
spring.kafka.consumer.group-id=delivery-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use-type-info-headers=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual
app.kafka.topics.create-delivery=${DELIVERY_CREATE_COMMAND_TOPIC:saga.command.create-delivery}
app.kafka.topics.cancel-delivery=${DELIVERY_CANCEL_COMMAND_TOPIC:saga.command.cancel-delivery}
app.kafka.topics.cache-shipper-found=${DELIVERY_CACHE_OFFER_COMMAND_TOPIC:saga.command.cache-shipper-found}
app.kafka.topics.expire-shipper-offer=${DELIVERY_EXPIRE_OFFER_COMMAND_TOPIC:saga.command.expire-shipper-offer}
app.kafka.topics.mark-shipper-not-found=${DELIVERY_NOT_FOUND_COMMAND_TOPIC:saga.command.mark-shipper-not-found}
app.kafka.topics.offer-persisted=${DELIVERY_OFFER_PERSISTED_TOPIC:delivery.offer-persisted}
app.kafka.topics.offer-retired=${DELIVERY_OFFER_RETIRED_TOPIC:delivery.offer-retired}
app.kafka.topics.delivery-status-updated=${DELIVERY_STATUS_UPDATED_TOPIC:delivery.status-updated}
app.kafka.topics.delivery-completed=${DELIVERY_COMPLETED_TOPIC:delivery.completed}
app.kafka.topics.shipper-status-change=${DELIVERY_SHIPPER_STATUS_TOPIC:shipper.status-change}
app.kafka.topics.delivery-exception-reported=${DELIVERY_EXCEPTION_REPORTED_TOPIC:delivery.exception.reported}
app.kafka.retry.attempts=${KAFKA_RETRY_ATTEMPTS:4}
app.kafka.retry.initial-delay-ms=${KAFKA_RETRY_INITIAL_DELAY_MS:1000}
app.kafka.retry.multiplier=${KAFKA_RETRY_MULTIPLIER:2.0}
app.kafka.retry.max-delay-ms=${KAFKA_RETRY_MAX_DELAY_MS:10000}
app.kafka.retry.auto-create-topics=${KAFKA_RETRY_AUTO_CREATE_TOPICS:false}

# Batch assignment remains disabled until Match, Delivery, Settlement,
# Tracking and the shipper client support the atomic batch contract.
delivery.batch.enabled=${DELIVERY_BATCH_ENABLED:false}
delivery.batch.max-orders=${DELIVERY_BATCH_MAX_ORDERS:3}
delivery.batch.accept-timeout-seconds=${DELIVERY_BATCH_ACCEPT_TIMEOUT_SECONDS:20}
delivery.batch.expiry-scan-ms=${DELIVERY_BATCH_EXPIRY_SCAN_MS:1000}
# POD and post-pickup exceptions remain dark until private object storage,
# broker provisioning, Settlement manual-review handling and clients are ready.
delivery.pod.enabled=${DELIVERY_POD_ENABLED:false}
delivery.pod.storage-provider=${DELIVERY_POD_STORAGE_PROVIDER:}
delivery.pod.retention-sweep-ms=${DELIVERY_POD_RETENTION_SWEEP_MS:3600000}
delivery.exception.enabled=${DELIVERY_EXCEPTION_ENABLED:false}
delivery.exception.retry-sweep-ms=${DELIVERY_EXCEPTION_RETRY_SWEEP_MS:60000}
app.shipper.identity-topic=${SHIPPER_IDENTITY_TOPIC:shipper.identity.upserted}
app.shipper.identity-consumer-group=${SHIPPER_IDENTITY_CONSUMER_GROUP:delivery-shipper-identity-v1}
app.shipper.identity-projection.enforced=${SHIPPER_IDENTITY_PROJECTION_ENFORCED:false}
app.shipper.identity.retry.attempts=${SHIPPER_IDENTITY_KAFKA_RETRY_ATTEMPTS:4}
app.shipper.identity.retry.initial-delay-ms=${SHIPPER_IDENTITY_KAFKA_RETRY_INITIAL_DELAY_MS:1000}
app.shipper.identity.retry.multiplier=${SHIPPER_IDENTITY_KAFKA_RETRY_MULTIPLIER:2.0}
app.shipper.identity.retry.max-delay-ms=${SHIPPER_IDENTITY_KAFKA_RETRY_MAX_DELAY_MS:10000}
app.shipper.identity.retry.auto-create-topics=${SHIPPER_IDENTITY_KAFKA_RETRY_AUTO_CREATE_TOPICS:false}
